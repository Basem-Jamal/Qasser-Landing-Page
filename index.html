<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <link rel="icon" href="/logoQasserOrchid.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تواصل معنا - حسابات التواصل الاجتماعي</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/Style.css">
</head>
<body>
    <div class="container">
        <header>
            <img class="logo_Qasser" src="/logoQasserOrchid.png" alt="">
            <!-- <h1 class="logo">قصر الاوركيد</h1> -->
            <p class="tagline">تواصل معنا على منصات التواصل الاجتماعي</p>

            <div class="iconsForArrow">              
                <img class="IconArrowRight" src="/arrowRight.png" alt="">
                <img class="IconArrowLeft" src="/arrowLeft.png" alt="">
            </div>
        </header>

        <div class="social-container">
            <!-- إنستغرام -->
            <div class="social-card instagram fade-in">
                <div class="social-icon">
                    <i class="fab fa-instagram"></i>
                </div>
                <h3 class="social-name">إنستغرام</h3>
                <p class="social-username">@SocialConnect</p>
                <div class="social-stats">
                    <div class="stat">
                        <div class="stat-value">24.3K</div>
                        <div class="stat-label">متابعون</div>
                    </div>
                    <div class="stat">
                        <div class="stat-value">156</div>
                        <div class="stat-label">منشورات</div>
                    </div>
                </div>
                <a href="https://www.instagram.com/oudorchid.qa" class="btn">تابعنا</a>
            </div>


            <!-- تيك توك -->
            <div class="social-card tiktok fade-in">
                <div class="social-icon">
                    <i class="fab fa-tiktok"></i>
                </div>
                <h3 class="social-name">تيك توك</h3>
                <p class="social-username">@SocialConnect</p>
                <div class="social-stats">
                    <div class="stat">
                        <div class="stat-value">32.1K</div>
                        <div class="stat-label">متابعون</div>
                    </div>
                    <div class="stat">
                        <div class="stat-value">104</div>
                        <div class="stat-label">فيديوهات</div>
                    </div>
                </div>
                <a href="https://www.tiktok.com/@oudorchid.qa" class="btn">تابعنا</a>
            </div>
        </div>


        <footer>
            <p>© 2025 جميع الحقوق محفوظة. قصر الاوركيد</p>
        </footer>
    </div>

    <script src="/Script.js"></script>
</body>
</html>
